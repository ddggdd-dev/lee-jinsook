name: 블로그 글 가져오기
on:
  schedule:
    - cron: "7 21 * * *"   # 매일 06:07 (한국 시간)
  workflow_dispatch:
  push:
    paths: [".github/workflows/blog.yml", ".github/scripts/blog.mjs"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node .github/scripts/blog.mjs
      - name: 바뀌었으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json
          git diff --cached --quiet || (git commit -m "블로그 글 갱신" && git push)
